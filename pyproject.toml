[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monitor-for-brandmeister"
dynamic = ["version"]
description = "Unofficial desktop monitor for the BrandMeister DMR network: talkgroup activity, live audio, friend alerts, APRS/DMR messaging and open-data alerts"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hannulma" }]
keywords = ["brandmeister", "dmr", "ham radio", "amateur radio", "aprs", "hoseline", "talkgroup"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Finnish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Ham Radio",
]
dependencies = [
    "aiohttp>=3.8",
    "python-socketio[client]>=5.8",
    "websocket-client>=1.5",
    "certifi",
    "truststore>=0.9; python_version >= '3.10'",
    "keyring>=24",
    "sgp4>=2.20",
    "icalendar>=6",
    "recurring-ical-events>=3",
    "tzdata",                  # aikavyöhyketiedot Windowsille (kalenterit)
    "pyserial>=3.5",           # APRS: KISS-TNC sarjaportissa (USB / Bluetooth)
    "pywebview>=5.3; sys_platform == 'win32' or sys_platform == 'darwin'",   # oma ikkuna
    "pystray>=0.19; sys_platform == 'win32'",                                # kuvake ilmaisinalueella
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/hannulma/monitor-for-amateur-radio"
Issues = "https://github.com/hannulma/monitor-for-amateur-radio/issues"

[project.scripts]
monitor-for-brandmeister = "bmmonitor.app:main"
bmmonitor = "bmmonitor.app:main"

[tool.setuptools]
packages = ["bmmonitor"]

[tool.setuptools.dynamic]
version = { attr = "bmmonitor.__version__" }

[tool.setuptools.package-data]
bmmonitor = ["static/*", "static/icons/*", "static/sheets/*", "static/vendor/leaflet/*", "static/vendor/leaflet/images/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
