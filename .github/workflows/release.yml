name: Release

# Julkaisu käynnistyy automaattisesti, kun main-haaraan tulee uusi versionumero
# (bmmonitor/__init__.py: __version__), jota ei ole vielä julkaistu. Työnkulku rakentaa paketit,
# luo tagin v<versio> ja julkaisun. Myös käsin pushattu v*-tagi tai "Run workflow" käynnistää sen.
on:
  push:
    branches: [main]
    paths: ["bmmonitor/__init__.py", ".github/workflows/release.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          VERSION=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('bmmonitor/__init__.py').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ (a|b|rc)[0-9]+$ ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "v$VERSION" ]]; then
              echo "::error::Tagi ${GITHUB_REF_NAME} ei vastaa versiota v$VERSION"; exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Versio v$VERSION on jo julkaistu – ei uutta julkaisua."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Uusi versio v$VERSION – rakennetaan ja julkaistaan."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  python-package:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  windows:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 300          # allekirjoitus odottaa käsin tehtävää hyväksyntää
    permissions:
      contents: read
      actions: read               # SignPath hakee allekirjoitettavan artefaktin tästä ajosta
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}   # valinnainen: VirusTotal-tarkistus, jos salaisuus on asetettu
      # Koodin allekirjoitus (SignPath Foundation): käytössä, kun SIGNPATH_API_TOKEN-salaisuus on asetettu.
      # Organisaation tunnus ja slugit repositorion muuttujina (Settings → Secrets and variables → Variables).
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install (PyInstaller with a self-compiled bootloader)
        shell: pwsh
        run: |
          # PyInstallerin käynnistysohjelma käännetään itse: valmiiksi käännetty bootloader on monen
          # virustorjunnan koneoppimistunnistuksen (esim. Defenderin Wacatac!ml) yleinen väärä hälytys.
          python -m pip install --upgrade pip wheel
          pip download --no-binary :all: --no-deps -d pyi_src pyinstaller
          $tgz = Get-ChildItem pyi_src\pyinstaller-*.tar.gz | Select-Object -First 1
          tar -xzf $tgz.FullName -C pyi_src
          $dir = Get-ChildItem pyi_src -Directory | Select-Object -First 1
          Push-Location (Join-Path $dir.FullName "bootloader")
          python ./waf distclean all --target-arch=64bit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          pip install $dir.FullName
          pip install .
      - name: Version info
        id: ver
        shell: pwsh
        run: |
          $num = python installer/version_info.py build/version_info.txt
          Write-Host "Numeerinen versio: $num"
          "num=$num" >> $env:GITHUB_OUTPUT
      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --onedir --noconsole --name MonitorForBrandMeister --collect-submodules win32ctypes
          --version-file build\version_info.txt
          --icon installer\icon.ico --hidden-import pystray._win32
          --hidden-import webview.platforms.winforms --hidden-import webview.platforms.edgechromium
          --add-data "bmmonitor/static;bmmonitor/static"
          --collect-submodules engineio --collect-submodules socketio --collect-submodules truststore --collect-submodules keyring --collect-submodules sgp4 --collect-data tzdata --collect-data icalendar --collect-submodules icalendar
          --hidden-import websocket --hidden-import certifi
          run_bmmonitor.py
      - name: Check exe version info
        shell: pwsh
        run: |
          $vi = (Get-Item "dist\MonitorForBrandMeister\MonitorForBrandMeister.exe").VersionInfo
          $vi | Format-List ProductName, ProductVersion, FileVersion, FileDescription, CompanyName
          if ($vi.ProductName -ne "Monitor for Amateur Radio" -or $vi.ProductVersion -ne "${{ needs.version.outputs.version }}") {
            Write-Error "Ohjelmatiedoston versiotiedot puuttuvat tai ovat väärin"; exit 1 }
      - name: Upload unsigned exe for signing
        if: env.SIGNPATH_API_TOKEN != ''
        id: up-exe
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: dist/MonitorForBrandMeister/MonitorForBrandMeister.exe
      - name: Sign exe (SignPath – waits for manual approval)
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'monitor-for-amateur-radio' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_EXE || 'exe' }}
          github-artifact-id: ${{ steps.up-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: signed-exe
      - name: Use signed exe
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          Copy-Item signed-exe\MonitorForBrandMeister.exe dist\MonitorForBrandMeister\MonitorForBrandMeister.exe -Force
          $sig = Get-AuthenticodeSignature dist\MonitorForBrandMeister\MonitorForBrandMeister.exe
          Write-Host "Allekirjoitus: $($sig.Status) – $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") { Write-Error "Allekirjoitus ei kelpaa"; exit 1 }
      - name: Smoke test (starts, connects to BrandMeister, quits)
        shell: pwsh
        run: |
          $log = Join-Path $env:APPDATA "BMMonitor\monitor.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "dist\MonitorForBrandMeister\MonitorForBrandMeister.exe" -ArgumentList "--no-browser","--port","8799" -PassThru
          $ok = $false
          foreach ($i in 1..90) {
            Start-Sleep 1
            if ($p.HasExited) { Write-Host "Ohjelma sulkeutui, exit code $($p.ExitCode)"; break }
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern "Yhdistetty Brandmeisteriin" -Quiet)) {
              try { $ping = Invoke-RestMethod http://127.0.0.1:8799/api/ping; Write-Host "ping: $($ping | ConvertTo-Json -Compress)"; $ok = $true; break } catch { }
            }
          }
          if ($ok) {
            Start-Sleep 5   # ikkuna ja kuvake ehtivät käynnistyä
            try { $show = Invoke-RestMethod -Method Post http://127.0.0.1:8799/api/ui/show; Write-Host "ui/show: $($show | ConvertTo-Json -Compress)"; if (-not $show.ok) { $ok = $false } } catch { Write-Host "ui/show epäonnistui: $_"; $ok = $false }
            Start-Sleep 3
            if ($p.HasExited) { Write-Host "Ohjelma kaatui ikkunan avauksen jälkeen, exit code $($p.ExitCode)"; $ok = $false }
          }
          try { Invoke-RestMethod -Method Post http://127.0.0.1:8799/api/shutdown | Out-Null } catch { }
          if (-not $p.WaitForExit(15000)) { Write-Host "Ei sulkeutunut, lopetetaan"; $p.Kill(); $ok = $false }
          Write-Host "--- monitor.log ---"
          if (Test-Path $log) { Get-Content $log } else { Write-Host "(ei lokia: $log)"; Get-ChildItem (Join-Path $env:APPDATA "BMMonitor") -ErrorAction SilentlyContinue }
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern "NET-poikkeus|Traceback|Fatal Python error" -Quiet)) { Write-Host "Lokissa virhe"; $ok = $false }
          if (-not $ok) { Write-Error "Käynnistystesti epäonnistui"; exit 1 }
          $st = Join-Path $env:RUNNER_TEMP "secrets.txt"
          $p = Start-Process -FilePath "dist\MonitorForBrandMeister\MonitorForBrandMeister.exe" -ArgumentList "--check-secrets",$st -PassThru
          $p.WaitForExit(60000) | Out-Null
          Get-Content $st
          if (-not (Select-String -Path $st -Pattern "secrets OK" -Quiet)) { Write-Error "Salasanavarasto ei toimi paketissa"; exit 1 }
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" | Select-Object -First 1
          }
          & $iscc.FullName "/DAppVersion=${{ needs.version.outputs.version }}" "/DNumVersion=${{ steps.ver.outputs.num }}" installer\windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload unsigned installer for signing
        if: env.SIGNPATH_API_TOKEN != ''
        id: up-setup
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: installer/Output/*.exe
      - name: Sign installer (SignPath – waits for manual approval)
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'monitor-for-amateur-radio' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_SETUP || 'installer' }}
          github-artifact-id: ${{ steps.up-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: signed-setup
      - name: Use signed installer
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          Copy-Item signed-setup\*.exe installer\Output\ -Force
          Get-ChildItem installer\Output\*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host "$($_.Name): $($sig.Status) – $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne "Valid") { Write-Error "Asennusohjelman allekirjoitus ei kelpaa"; exit 1 } }
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item installer\Output\*.exe out\
          Copy-Item LICENSE dist\MonitorForBrandMeister\LICENSE.txt
          Compress-Archive -Path dist\MonitorForBrandMeister -DestinationPath "out\MonitorForBrandMeister-${{ needs.version.outputs.version }}-windows-portable.zip"
      - name: VirusTotal (optional, results in the run summary)
        if: env.VT_API_KEY != ''
        continue-on-error: true
        shell: pwsh
        run: |
          $files = @(Get-ChildItem out\*-windows-setup.exe | ForEach-Object FullName) + "dist\MonitorForBrandMeister\MonitorForBrandMeister.exe"
          python installer/vt_check.py @files
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  # Universal2-Mac-versio: yksi .app/.dmg, joka toimii natiivisti sekä Intel- että Apple Silicon (M1–M4) -Maceissa.
  # Rakennetaan Intel-koneella, koska GitHubin arm64-Mac-koneita ei aina saada. Käytetään python.orgin universal2-Pythonia ja yhdistetään
  # x86_64- ja arm64-pyörät (delocate-merge). Ajetaan koekäännöksenä myös, kun työnkulkua muutetaan.
  macos-universal:
    needs: version
    timeout-minutes: 40
    runs-on: macos-15-intel
    env:
      PY_PKG_VERSION: "3.12.8"
    steps:
      - uses: actions/checkout@v4
      - name: Install universal2 Python (python.org)
        run: |
          curl -fsSL -o py.pkg "https://www.python.org/ftp/python/${PY_PKG_VERSION}/python-${PY_PKG_VERSION}-macos11.pkg"
          sudo installer -pkg py.pkg -target /
          PY=/Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12
          lipo -archs "$PY"
          "$PY" -m venv venv
          venv/bin/python -m pip install --upgrade pip
          venv/bin/pip install "delocate>=0.11" pyinstaller
      - name: Build universal2 wheels for dependencies
        run: |
          set -e
          DEPS=$(venv/bin/python -c "import tomllib;print('\n'.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))")
          echo "$DEPS" > deps.txt
          # puhtaat Python-paketit, joista PyPI:ssä on vain lähdekoodi (pywebview → proxy_tools)
          venv/bin/pip wheel proxy_tools --no-deps -w wh_pure
          for A in x86_64 arm64; do
            venv/bin/pip download -r deps.txt -d "wh_$A" --find-links wh_pure --only-binary=:all: \
              --platform "macosx_11_0_$A" --platform "macosx_10_9_universal2" --python-version 3.12 --implementation cp
          done
          mkdir -p wh_uni
          venv/bin/python - <<'PY'
          import glob, os, shutil, subprocess
          def key(f): return "-".join(os.path.basename(f).split("-")[:2]).lower()
          x86 = {key(f): f for f in glob.glob("wh_x86_64/*.whl")}
          for f in glob.glob("wh_arm64/*.whl"):
              k = key(f)
              if f.endswith("arm64.whl"):
                  subprocess.run(["venv/bin/delocate-merge", f, x86[k], "-w", "wh_uni"], check=True)
              else:
                  shutil.copy(f, "wh_uni")
          print("\n".join(sorted(os.listdir("wh_uni"))))
          PY
          cp wh_pure/*.whl wh_uni/
          venv/bin/pip install --no-index --find-links wh_uni -r deps.txt
          venv/bin/pip install --no-deps .
      - name: Build app
        run: >
          venv/bin/pyinstaller --noconfirm --clean --windowed --target-arch universal2
          --name "Monitor for BrandMeister" --icon installer/icon.icns --hidden-import webview.platforms.cocoa
          --osx-bundle-identifier io.github.hannulma.monitorforbrandmeister
          --add-data "bmmonitor/static:bmmonitor/static"
          --collect-submodules engineio --collect-submodules socketio --collect-submodules truststore --collect-submodules keyring --collect-submodules sgp4 --collect-data tzdata --collect-data icalendar --collect-submodules icalendar
          --hidden-import websocket --hidden-import certifi
          run_bmmonitor.py
      - name: Verify architectures and smoke test
        run: |
          APP="dist/Monitor for BrandMeister.app"
          lipo -archs "$APP/Contents/MacOS/Monitor for BrandMeister"
          find "$APP" -name "*.so" -o -name "*.dylib" | while read f; do
            a=$(lipo -archs "$f"); case "$a" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "::error::$f: $a"; exit 1;; esac
          done
          echo "Kaikki binäärit ovat universal2"
      - name: Display name (Monitor for Amateur Radio)
        run: |
          # Näkyvä nimi valikkoriville ja Dockiin; paketin tiedosto, ohjelmatiedosto ja bundle id pysyvät ennallaan
          # (automaattinen päivitys korvaa käyttäjän nykyisen .app-paketin samassa paikassa).
          APP="dist/Monitor for BrandMeister.app"
          plutil -replace CFBundleName -string "Monitor for Amateur Radio" "$APP/Contents/Info.plist"
          plutil -replace CFBundleDisplayName -string "Monitor for Amateur Radio" "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          plutil -p "$APP/Contents/Info.plist" | grep -E "CFBundle(Name|DisplayName|Identifier|Executable)"
      - name: Smoke test (connects to BrandMeister)
        run: |
          BIN="dist/Monitor for BrandMeister.app/Contents/MacOS/Monitor for BrandMeister"
          ok=0
          for attempt in 1 2 3; do
            "$BIN" --diag > diag.txt 2>&1 & P=$!
            for i in $(seq 60); do kill -0 $P 2>/dev/null || break; sleep 1; done
            kill $P 2>/dev/null || true
            cat diag.txt
            if grep -q "YHDISTETTY" diag.txt; then ok=1; break; fi
            sleep 10
          done
          [ "$ok" = 1 ] || { echo "::error::Sovellus ei saanut yhteyttä BrandMeisteriin"; exit 1; }
          "$BIN" --check-secrets "$RUNNER_TEMP/secrets.txt" || true
          cat "$RUNNER_TEMP/secrets.txt" || echo "::warning::Avainnippu-testiä ei saatu ajettua (CI-koneen avainnippu voi olla lukittu)"
      - name: Smoke test (own window, quits cleanly)
        continue-on-error: true
        run: |
          BIN="dist/Monitor for BrandMeister.app/Contents/MacOS/Monitor for BrandMeister"
          "$BIN" --no-browser --port 8799 & P=$!
          ok=0
          for i in $(seq 60); do sleep 1; curl -fsS http://127.0.0.1:8799/api/ping && { ok=1; break; }; done
          curl -fsS -X POST http://127.0.0.1:8799/api/shutdown || true
          for i in $(seq 20); do kill -0 $P 2>/dev/null || break; sleep 1; done
          if kill -0 $P 2>/dev/null; then echo "::warning::Ohjelma ei sulkeutunut ikkunatilassa"; kill $P; fi
          tail -n 40 "$HOME/Library/Application Support/BMMonitor/monitor.log" 2>/dev/null || true
          [ "$ok" = 1 ] || echo "::warning::Ikkunatilan käynnistystesti ei vastannut"
      - name: Build dmg
        run: |
          VERSION=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('bmmonitor/__init__.py').read()).group(1))")
          mkdir -p out dmgroot
          # uudessa asennuksessa paketin nimi on uusi; päivitys käyttää käyttäjän nykyistä polkua
          cp -R "dist/Monitor for BrandMeister.app" "dmgroot/Monitor for Amateur Radio.app"
          ln -s /Applications dmgroot/Applications
          # hdiutil epäonnistuu CI-koneella toisinaan "Resource busy" -virheeseen: yritetään uudelleen
          for i in 1 2 3 4 5; do
            hdiutil create -volname "Monitor for Amateur Radio" -srcfolder dmgroot -ov -format UDZO \
              "out/MonitorForBrandMeister-${VERSION}-macos-universal.dmg" && break
            echo "hdiutil epäonnistui (yritys $i), odotetaan…"; sleep 15
            [ "$i" = 5 ] && exit 1
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: out/*

  linux:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
      - name: Build
        run: >
          pyinstaller --noconfirm --clean --onefile --name monitor-for-brandmeister
          --add-data "bmmonitor/static:bmmonitor/static"
          --collect-submodules engineio --collect-submodules socketio --collect-submodules truststore --collect-submodules keyring --collect-submodules sgp4 --collect-data tzdata --collect-data icalendar --collect-submodules icalendar
          --hidden-import websocket --hidden-import certifi
          run_bmmonitor.py
      - name: Package
        run: |
          mkdir -p out pkg/monitor-for-brandmeister
          cp dist/monitor-for-brandmeister LICENSE README.md pkg/monitor-for-brandmeister/
          tar -C pkg -czf "out/MonitorForBrandMeister-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz" monitor-for-brandmeister
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  release:
    needs: [version, python-package, windows, macos-universal, linux]
    runs-on: ubuntu-latest
    if: >-
      always() && needs.version.outputs.release == 'true' &&
      needs.python-package.result == 'success' && needs.windows.result == 'success' &&
      needs.macos-universal.result == 'success' && needs.linux.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Monitor for BrandMeister ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body_path: .github/release-notes.md
          files: artifacts/*
