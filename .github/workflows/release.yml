name: Release

# Julkaisu käynnistyy automaattisesti, kun main-haaraan tulee uusi versionumero
# (bmmonitor/__init__.py: __version__), jota ei ole vielä julkaistu. Työnkulku rakentaa paketit,
# luo tagin v<versio> ja julkaisun. Myös käsin pushattu v*-tagi tai "Run workflow" käynnistää sen.
on:
  push:
    branches: [main]
    paths: ["bmmonitor/__init__.py", ".github/workflows/release.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          VERSION=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('bmmonitor/__init__.py').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ (a|b|rc)[0-9]+$ ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "v$VERSION" ]]; then
              echo "::error::Tagi ${GITHUB_REF_NAME} ei vastaa versiota v$VERSION"; exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Versio v$VERSION on jo julkaistu – ei uutta julkaisua."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Uusi versio v$VERSION – rakennetaan ja julkaistaan."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  python-package:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  windows:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}   # valinnainen: VirusTotal-tarkistus, jos salaisuus on asetettu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --onedir --noconsole --name MonitorForBrandMeister --collect-submodules win32ctypes
          --add-data "bmmonitor/static;bmmonitor/static"
          --collect-submodules engineio --collect-submodules socketio --collect-submodules truststore --collect-submodules keyring
          --hidden-import websocket --hidden-import certifi
          run_bmmonitor.py
      - name: Smoke test (starts, connects to BrandMeister, quits)
        shell: pwsh
        run: |
          $log = Join-Path $env:APPDATA "BMMonitor\monitor.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "dist\MonitorForBrandMeister\MonitorForBrandMeister.exe" -ArgumentList "--no-browser","--port","8799" -PassThru
          $ok = $false
          foreach ($i in 1..90) {
            Start-Sleep 1
            if ($p.HasExited) { Write-Host "Ohjelma sulkeutui, exit code $($p.ExitCode)"; break }
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern "Yhdistetty Brandmeisteriin" -Quiet)) {
              try { $ping = Invoke-RestMethod http://127.0.0.1:8799/api/ping; Write-Host "ping: $($ping | ConvertTo-Json -Compress)"; $ok = $true; break } catch { }
            }
          }
          try { Invoke-RestMethod -Method Post http://127.0.0.1:8799/api/shutdown | Out-Null } catch { }
          if (-not $p.WaitForExit(15000)) { Write-Host "Ei sulkeutunut, lopetetaan"; $p.Kill(); $ok = $false }
          Write-Host "--- monitor.log ---"
          if (Test-Path $log) { Get-Content $log } else { Write-Host "(ei lokia: $log)"; Get-ChildItem (Join-Path $env:APPDATA "BMMonitor") -ErrorAction SilentlyContinue }
          if (-not $ok) { Write-Error "Käynnistystesti epäonnistui"; exit 1 }
          $st = Join-Path $env:RUNNER_TEMP "secrets.txt"
          $p = Start-Process -FilePath "dist\MonitorForBrandMeister\MonitorForBrandMeister.exe" -ArgumentList "--check-secrets",$st -PassThru
          $p.WaitForExit(60000) | Out-Null
          Get-Content $st
          if (-not (Select-String -Path $st -Pattern "secrets OK" -Quiet)) { Write-Error "Salasanavarasto ei toimi paketissa"; exit 1 }
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" | Select-Object -First 1
          }
          & $iscc.FullName "/DAppVersion=${{ needs.version.outputs.version }}" installer\windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item installer\Output\*.exe out\
          Copy-Item LICENSE dist\MonitorForBrandMeister\LICENSE.txt
          Compress-Archive -Path dist\MonitorForBrandMeister -DestinationPath "out\MonitorForBrandMeister-${{ needs.version.outputs.version }}-windows-portable.zip"
      - name: VirusTotal (optional)
        if: env.VT_API_KEY != ''
        continue-on-error: true
        shell: bash
        run: |
          echo "### VirusTotal" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*-windows-setup.exe dist/MonitorForBrandMeister/MonitorForBrandMeister.exe; do
            curl -sS --fail -H "x-apikey: $VT_API_KEY" -F "file=@$f" https://www.virustotal.com/api/v3/files > /dev/null
            h=$(sha256sum "$f" | cut -d' ' -f1)
            echo "- \`$(basename "$f")\`: https://www.virustotal.com/gui/file/$h" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  # Universal2-Mac-versio: yksi .app/.dmg, joka toimii natiivisti sekä Intel- että Apple Silicon (M1–M4) -Maceissa.
  # Rakennetaan Intel-koneella, koska GitHubin arm64-Mac-koneita ei aina saada. Käytetään python.orgin universal2-Pythonia ja yhdistetään
  # x86_64- ja arm64-pyörät (delocate-merge). Ajetaan koekäännöksenä myös, kun työnkulkua muutetaan.
  macos-universal:
    needs: version
    timeout-minutes: 40
    runs-on: macos-15-intel
    env:
      PY_PKG_VERSION: "3.12.8"
    steps:
      - uses: actions/checkout@v4
      - name: Install universal2 Python (python.org)
        run: |
          curl -fsSL -o py.pkg "https://www.python.org/ftp/python/${PY_PKG_VERSION}/python-${PY_PKG_VERSION}-macos11.pkg"
          sudo installer -pkg py.pkg -target /
          PY=/Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12
          lipo -archs "$PY"
          "$PY" -m venv venv
          venv/bin/python -m pip install --upgrade pip
          venv/bin/pip install "delocate>=0.11" pyinstaller
      - name: Build universal2 wheels for dependencies
        run: |
          set -e
          DEPS=$(venv/bin/python -c "import tomllib;print('\n'.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))")
          echo "$DEPS" > deps.txt
          for A in x86_64 arm64; do
            venv/bin/pip download -r deps.txt -d "wh_$A" --only-binary=:all: \
              --platform "macosx_11_0_$A" --platform "macosx_10_9_universal2" --python-version 3.12 --implementation cp
          done
          mkdir -p wh_uni
          venv/bin/python - <<'PY'
          import glob, os, shutil, subprocess
          def key(f): return "-".join(os.path.basename(f).split("-")[:2]).lower()
          x86 = {key(f): f for f in glob.glob("wh_x86_64/*.whl")}
          for f in glob.glob("wh_arm64/*.whl"):
              k = key(f)
              if f.endswith("arm64.whl"):
                  subprocess.run(["venv/bin/delocate-merge", f, x86[k], "-w", "wh_uni"], check=True)
              else:
                  shutil.copy(f, "wh_uni")
          print("\n".join(sorted(os.listdir("wh_uni"))))
          PY
          venv/bin/pip install --no-index --find-links wh_uni -r deps.txt
          venv/bin/pip install --no-deps .
      - name: Build app
        run: >
          venv/bin/pyinstaller --noconfirm --clean --windowed --target-arch universal2
          --name "Monitor for BrandMeister"
          --osx-bundle-identifier io.github.hannulma.monitorforbrandmeister
          --add-data "bmmonitor/static:bmmonitor/static"
          --collect-submodules engineio --collect-submodules socketio --collect-submodules truststore --collect-submodules keyring
          --hidden-import websocket --hidden-import certifi
          run_bmmonitor.py
      - name: Verify architectures and smoke test
        run: |
          APP="dist/Monitor for BrandMeister.app"
          lipo -archs "$APP/Contents/MacOS/Monitor for BrandMeister"
          find "$APP" -name "*.so" -o -name "*.dylib" | while read f; do
            a=$(lipo -archs "$f"); case "$a" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "::error::$f: $a"; exit 1;; esac
          done
          echo "Kaikki binäärit ovat universal2"
      - name: Smoke test (connects to BrandMeister)
        run: |
          BIN="dist/Monitor for BrandMeister.app/Contents/MacOS/Monitor for BrandMeister"
          ok=0
          for attempt in 1 2 3; do
            "$BIN" --diag > diag.txt 2>&1 & P=$!
            for i in $(seq 60); do kill -0 $P 2>/dev/null || break; sleep 1; done
            kill $P 2>/dev/null || true
            cat diag.txt
            if grep -q "YHDISTETTY" diag.txt; then ok=1; break; fi
            sleep 10
          done
          [ "$ok" = 1 ] || { echo "::error::Sovellus ei saanut yhteyttä BrandMeisteriin"; exit 1; }
          "$BIN" --check-secrets "$RUNNER_TEMP/secrets.txt" || true
          cat "$RUNNER_TEMP/secrets.txt" || echo "::warning::Avainnippu-testiä ei saatu ajettua (CI-koneen avainnippu voi olla lukittu)"
      - name: Build dmg
        run: |
          VERSION=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('bmmonitor/__init__.py').read()).group(1))")
          mkdir -p out dmgroot
          cp -R "dist/Monitor for BrandMeister.app" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Monitor for BrandMeister" -srcfolder dmgroot -ov -format UDZO \
            "out/MonitorForBrandMeister-${VERSION}-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: out/*

  linux:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
      - name: Build
        run: >
          pyinstaller --noconfirm --clean --onefile --name monitor-for-brandmeister
          --add-data "bmmonitor/static:bmmonitor/static"
          --collect-submodules engineio --collect-submodules socketio --collect-submodules truststore --collect-submodules keyring
          --hidden-import websocket --hidden-import certifi
          run_bmmonitor.py
      - name: Package
        run: |
          mkdir -p out pkg/monitor-for-brandmeister
          cp dist/monitor-for-brandmeister LICENSE README.md pkg/monitor-for-brandmeister/
          tar -C pkg -czf "out/MonitorForBrandMeister-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz" monitor-for-brandmeister
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  release:
    needs: [version, python-package, windows, macos-universal, linux]
    runs-on: ubuntu-latest
    if: >-
      always() && needs.version.outputs.release == 'true' &&
      needs.python-package.result == 'success' && needs.windows.result == 'success' &&
      needs.macos-universal.result == 'success' && needs.linux.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Monitor for BrandMeister ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body_path: .github/release-notes.md
          files: artifacts/*
